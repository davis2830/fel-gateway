services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: felgateway
      POSTGRES_PASSWORD: felgateway
      POSTGRES_DB: felgateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felgateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: felgateway
      RABBITMQ_DEFAULT_PASS: felgateway
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://felgateway:felgateway@db:5432/felgateway
      CELERY_BROKER_URL: amqp://felgateway:felgateway@rabbitmq:5672//
      CELERY_RESULT_BACKEND: db+postgresql+psycopg://felgateway:felgateway@db:5432/felgateway
      MASTER_API_KEY: dev-master-key-change-in-production
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://felgateway:felgateway@db:5432/felgateway
      CELERY_BROKER_URL: amqp://felgateway:felgateway@rabbitmq:5672//
      CELERY_RESULT_BACKEND: db+postgresql+psycopg://felgateway:felgateway@db:5432/felgateway
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

volumes:
  pgdata: {}
