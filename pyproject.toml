[project]
name = "fel-gateway"
version = "0.1.0"
description = "FEL gateway: certifica DTEs ante SAT Guatemala via certificadores autorizados"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "celery>=5.4",
    "kombu>=5.4",
    "redis>=5.2",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# B008: FastAPI uses ``Depends`` in argument defaults idiomatically.
# RUF012: SQLAlchemy ORM mapped containers don't need ClassVar annotations.
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely have unused tuple unpack vars (fixture wires both pieces).
"tests/*" = ["RUF059"]
